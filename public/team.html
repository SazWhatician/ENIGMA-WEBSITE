<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="description" content="ENIGMA - The Official Coding Club of VSSUT Burla. Explore our events, projects, team, and connect with us.">
    <meta name="keywords" content="ENIGMA, Coding Club, VSSUT, Burla, Programming, Tech, Events, Projects">
    <meta property="og:title" content="ENIGMA | Coding Club VSSUT">
    <meta property="og:description" content="The Official Coding Club of VSSUT Burla. Explore our events, projects, and team.">
    <meta property="og:image" content="https://www.enigmavssut.in/logo-bg.png">
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <title>ENIGMA | Team</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Host+Grotesk:ital,wght@0,300..800;1,300..800&family=Syncopate:wght@400;700&display=swap"
        rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
    <script src="https://unpkg.com/@barba/core"></script>
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        void: '#000000', orbitGreen: '#2BA648', orbitDark: '#0F3918',
                    },
                    fontFamily: {
                        sans: ['"Host Grotesk"', 'sans-serif'], syncopate: ['"Syncopate"', 'sans-serif'],
                    }
                }
            }
        }
    </script>

<style>
    /* MASTER OVERRIDES FOR HAMBURGER & NAV */
    .hamburger { 
        display: none !important; 
        z-index: 3000 !important;
    }
    nav {
        z-index: 2000 !important;
    }
    .mobile-menu {
        z-index: 1500 !important;
    }
    @media (max-width: 768px) {
        .hamburger { 
            display: flex !important; 
        }
        .nav-items { 
            display: none !important; 
        }
        nav {
            background: transparent !important;
            backdrop-filter: none !important;
            -webkit-backdrop-filter: none !important;
            border-bottom: none !important;
            padding: 1.5rem !important;
            flex-direction: row !important;
            justify-content: space-between !important;
            align-items: center !important;
        }
    </style>

</head>

<body data-barba="wrapper" class="antialiased selection:bg-orbitGreen selection:text-void">

    <!-- BARBA TRANSITION PANELS -->
    <div class="page-transition">
        <div class="transition-panel"></div>
        <div class="transition-panel"></div>
        <div class="transition-panel"></div>
    </div>

    <!-- BLUEPRINT BACKGROUND -->
    <div class="blueprint-bg">
        <div class="bp-circle"></div>
        <div class="bp-line-h"></div>
        <div class="bp-line-v"></div>
        <div class="bp-line-d1"></div>
        <div class="bp-line-d2"></div>
    </div>

    <!-- BREATHING GRADIENT -->
    <div class="breathing-gradient"></div>

    <!-- LOADING SCREEN -->
    <div id="loading-screen"
        style="position: fixed; inset: 0; z-index: 50; display: flex; justify-content: center; align-items: center; background-color: #000; font-family: 'Syncopate', sans-serif; font-size: 2rem; color: #2BA648; flex-direction: column; gap: 1rem;">
        <img src="./image-assets/white-no bg.png" class="w-8 h-8 animate-[spin_4s_linear_infinite]" alt="ENIGMA Image" title="ENIGMA Image">
    </div>

    <!-- ====== MAIN BARBA CONTAINER ====== -->
    <main data-barba="container" data-barba-namespace="team">

        <!-- ALL STYLES INSIDE BARBA CONTAINER so they load during Barba transitions -->
        <style>
            /* ============================================
           GLOBAL RESET & BASE
           ============================================ */
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                font-family: 'Host Grotesk', sans-serif;
                background-color: #000;
                color: #fff;
                min-height: 100vh;
                overflow-x: hidden;
            }

            ::-webkit-scrollbar {
                display: none;
            }

            html {
                -ms-overflow-style: none;
                scrollbar-width: none;
                scroll-behavior: smooth;
            }

            /* ============================================
           BLUEPRINT BACKGROUND
           ============================================ */
            .blueprint-bg {
                position: fixed;
                inset: 0;
                z-index: 0;
                pointer-events: none;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .bp-circle {
                position: absolute;
                width: 90vmin;
                height: 90vmin;
                border: 1px solid rgba(255, 255, 255, 0.04);
                border-radius: 50%;
            }

            .bp-line-h {
                position: absolute;
                width: 100vw;
                height: 1px;
                background: rgba(255, 255, 255, 0.04);
            }

            .bp-line-v {
                position: absolute;
                width: 1px;
                height: 100vh;
                background: rgba(255, 255, 255, 0.04);
            }

            .bp-line-d1 {
                position: absolute;
                width: 150vw;
                height: 1px;
                background: rgba(255, 255, 255, 0.025);
                transform: rotate(30deg);
            }

            .bp-line-d2 {
                position: absolute;
                width: 150vw;
                height: 1px;
                background: rgba(255, 255, 255, 0.025);
                transform: rotate(-30deg);
            }

            /* ============================================
           BREATHING RADIAL GRADIENT
           ============================================ */
            .breathing-gradient {
                position: fixed;
                top: 50%;
                left: 50%;
                width: 120vmax;
                height: 120vmax;
                transform: translate(-50%, -50%);
                background: radial-gradient(ellipse at center, rgba(43, 166, 72, 0.04) 0%, transparent 60%);
                animation: breathe 8s ease-in-out infinite;
                pointer-events: none;
                z-index: 0;
            }

            @keyframes breathe {

                0%,
                100% {
                    opacity: 0.3;
                    transform: translate(-50%, -50%) scale(1);
                }

                50% {
                    opacity: 1;
                    transform: translate(-50%, -50%) scale(1.15);
                }
            }

            /* ============================================
           NAVIGATION
           ============================================ */
            nav {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                padding: 2rem;
                display: flex;
                justify-content: space-between;
                align-items: center;
                z-index: 2000;
                mix-blend-mode: difference;
            }

            nav,
            .logo p {
                font-weight: 700;
                font-size: 0.9rem;
                font-family: "Host Grotesk", sans-serif;
            }

            .logo a {
                text-decoration: none;
                color: white;
            }

            .nav-items {
                display: flex;
                gap: 2rem;
            }

            .nav-items a {
                text-decoration: none;
                color: white;
                transition: all 0.3s ease;
                position: relative;
            }

            .nav-items a:hover {
                color: #2BA648;
                text-shadow: 0 0 10px rgba(43, 166, 72, 0.6);
            }

            @media(max-width: 768px) {
                nav {
                    padding: 1.2rem;
                    flex-direction: column;
                    gap: 0.8rem;
                }

                .nav-items {
                    gap: 0.8rem;
                    font-size: 0.75rem;
                    flex-wrap: wrap;
                    justify-content: center;
                }
            }

            /* ============================================
           HERO SECTION
           ============================================ */
            .team-hero {
                position: relative;
                width: 100%;
                min-height: 50vh;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                overflow: hidden;
                padding-top: 6rem;
            }

            .hero-svg-bg {
                position: absolute;
                inset: 0;
                z-index: 0;
                opacity: 0.15;
            }

            .circuit-line {
                stroke: #2BA648;
                stroke-width: 1;
                fill: none;
                stroke-dasharray: 1000;
                stroke-dashoffset: 1000;
                filter: drop-shadow(0 0 3px rgba(43, 166, 72, 0.5));
            }

            .circuit-dot {
                fill: #2BA648;
                filter: drop-shadow(0 0 4px rgba(43, 166, 72, 0.8));
                opacity: 0;
            }

            .hero-title {
                font-family: 'Syncopate', sans-serif;
                font-size: clamp(3rem, 8vw, 7rem);
                font-weight: 700;
                text-transform: uppercase;
                letter-spacing: 0.15em;
                z-index: 2;
                position: relative;
                line-height: 1;
            }

            .hero-title .letter {
                display: inline-block;
                opacity: 0;
                transform: translateY(40px);
                color: transparent;
                -webkit-text-stroke: 1px rgba(255, 255, 255, 0.15);
                transition: color 0.6s ease, -webkit-text-stroke-color 0.6s ease;
            }

            .hero-title .letter.revealed {
                color: #fff;
                -webkit-text-stroke: 0;
                text-shadow: 0 0 30px rgba(43, 166, 72, 0.4), 0 0 60px rgba(43, 166, 72, 0.15);
            }

            .hero-subtitle {
                font-family: 'Host Grotesk', sans-serif;
                font-size: clamp(0.9rem, 1.5vw, 1.2rem);
                color: rgba(255, 255, 255, 0.4);
                letter-spacing: 0.3em;
                text-transform: uppercase;
                margin-top: 1.5rem;
                z-index: 2;
                opacity: 0;
                transform: translateY(20px);
            }

            .hero-line {
                width: 60px;
                height: 2px;
                background: linear-gradient(90deg, transparent, #2BA648, transparent);
                margin-top: 2rem;
                z-index: 2;
                opacity: 0;
                transform: scaleX(0);
            }

            /* ============================================
           FILTER BAR
           ============================================ */
            .filters-wrapper {
                display: flex;
                justify-content: center;
                flex-wrap: wrap;
                gap: 0.75rem;
                margin-bottom: 3rem;
                font-family: 'Syncopate', sans-serif;
                position: relative;
                z-index: 10;
                padding: 0 1rem;
            }

            .filter-btn {
                background: rgba(255, 255, 255, 0.03);
                border: 1px solid rgba(255, 255, 255, 0.1);
                color: rgba(255, 255, 255, 0.5);
                padding: 0.6rem 1.8rem;
                font-size: 0.75rem;
                border-radius: 50px;
                cursor: pointer;
                transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
                text-transform: uppercase;
                letter-spacing: 0.1em;
                position: relative;
                overflow: hidden;
                font-family: 'Syncopate', sans-serif;
            }

            .filter-btn::before {
                content: '';
                position: absolute;
                inset: 0;
                border-radius: 50px;
                background: radial-gradient(circle at center, rgba(43, 166, 72, 0.2), transparent 70%);
                opacity: 0;
                transition: opacity 0.4s ease;
            }

            .filter-btn:hover {
                border-color: rgba(43, 166, 72, 0.5);
                color: #fff;
                transform: translateY(-2px);
                box-shadow: 0 5px 20px rgba(43, 166, 72, 0.15);
            }

            .filter-btn:hover::before {
                opacity: 1;
            }

            .filter-btn.active {
                background: linear-gradient(135deg, #2BA648, #1a7a33);
                color: #000;
                border-color: #2BA648;
                font-weight: 700;
                box-shadow: 0 0 25px rgba(43, 166, 72, 0.3), inset 0 0 15px rgba(255, 255, 255, 0.1);
                transform: translateY(-2px);
            }

            .filter-btn.active::before {
                opacity: 0;
            }

            /* ============================================
           TEAM CONTAINER & GRID
           ============================================ */
            .team-container {
                position: relative;
                z-index: 10;
                width: 100%;
                max-width: 1400px;
                margin: 0 auto;
                padding: 2rem 2rem 6rem 2rem;
                display: flex;
                flex-direction: column;
                gap: 2rem;
            }

            .team-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
                gap: 2rem;
                perspective: 1200px;
            }

            /* ============================================
           TEAM CARDS — GLASSMORPHISM
           ============================================ */
            .team-card-wrapper {
                background-color: transparent;
                width: 100%;
                height: 380px;
                perspective: 1200px;
                cursor: pointer;
                opacity: 0;
                visibility: hidden;
            }

            .card-inner {
                position: relative;
                width: 100%;
                height: 100%;
                text-align: center;
                transition: transform 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94);
                transform-style: preserve-3d;
            }

            .team-card-wrapper.flipped .card-inner {
                transform: rotateY(180deg);
            }

            .card-front,
            .card-back {
                position: absolute;
                width: 100%;
                height: 100%;
                -webkit-backface-visibility: hidden;
                backface-visibility: hidden;
                border-radius: 16px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                padding: 2rem;
                border: 1px solid rgba(255, 255, 255, 0.06);
                background: linear-gradient(145deg, rgba(15, 15, 15, 0.9), rgba(5, 5, 5, 0.95));
                backdrop-filter: blur(10px);
                -webkit-backdrop-filter: blur(10px);
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
                overflow: hidden;
                transition: border-color 0.4s ease, box-shadow 0.4s ease;
            }

            /* Green radial fill from avatar on hover */
            .card-front::before {
                content: '';
                position: absolute;
                top: 28%;
                left: 50%;
                width: 0;
                height: 0;
                border-radius: 50%;
                background: radial-gradient(circle, rgba(43, 166, 72, 0.18) 0%, rgba(43, 166, 72, 0.08) 40%, transparent 70%);
                transform: translate(-50%, -50%);
                transition: width 0.7s cubic-bezier(0.4, 0, 0.2, 1), height 0.7s cubic-bezier(0.4, 0, 0.2, 1);
                z-index: 0;
                pointer-events: none;
            }

            .team-card-wrapper:hover .card-front::before {
                width: 250%;
                height: 250%;
            }

            .team-card-wrapper:hover .card-front {
                border-color: rgba(43, 166, 72, 0.3);
                box-shadow: 0 15px 50px rgba(43, 166, 72, 0.12), 0 5px 20px rgba(0, 0, 0, 0.5);
            }

            /* Avatar */
            .card-avatar {
                width: 140px;
                height: 140px;
                border-radius: 50%;
                margin-bottom: 1.4rem;
                object-fit: cover;
                background: linear-gradient(135deg, rgba(43, 166, 72, 0.05), rgba(255, 255, 255, 0.02));
                border: 2px solid rgba(255, 255, 255, 0.08);
                transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
                position: relative;
                z-index: 1;
            }

            .team-card-wrapper:hover .card-avatar {
                border-color: rgba(43, 166, 72, 0.6);
                box-shadow: 0 0 25px rgba(43, 166, 72, 0.2);
                transform: scale(1.05);
            }

            /* Name & Role */
            .card-front h2 {
                font-family: 'Syncopate', sans-serif;
                font-size: 1rem;
                font-weight: 700;
                margin-bottom: 0.6rem;
                line-height: 1.3;
                letter-spacing: 0.05em;
                transition: text-shadow 0.4s ease;
            }

            .team-card-wrapper:hover .card-front h2 {
                text-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
            }

            .member-tag {
                display: inline-flex;
                align-items: center;
                gap: 0.5rem;
                font-family: 'Host Grotesk', sans-serif;
                font-size: 0.7rem;
                font-weight: bold;
                text-transform: uppercase;
                letter-spacing: 2px;
                padding: 0.25rem 0.75rem;
                border-radius: 6px;
                margin-bottom: 0.5rem;
                box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
            }

            .tag-golden {
                background: linear-gradient(135deg, #ffd700, #daa520);
                color: #111;
                border: 1px solid #ffd700;
                text-shadow: 0 1px 2px rgba(255, 255, 255, 0.3);
            }

            .tag-silver {
                background: linear-gradient(135deg, #e0e0e0, #9e9e9e);
                color: #111;
                border: 1px solid #e0e0e0;
                text-shadow: 0 1px 2px rgba(255, 255, 255, 0.3);
            }

            .card-role {
                display: inline-flex;
                align-items: center;
                gap: 0.5rem;
                font-family: 'Host Grotesk', sans-serif;
                color: #2BA648;
                font-size: 0.8rem;
                text-transform: uppercase;
                letter-spacing: 2px;
                padding: 0.3rem 0.8rem;
                border-radius: 20px;
                background: rgba(43, 166, 72, 0.08);
                border: 1px solid rgba(43, 166, 72, 0.15);
            }

            .role-dot {
                width: 6px;
                height: 6px;
                border-radius: 50%;
                background: #2BA648;
                animation: pulse-dot 2s ease-in-out infinite;
            }

            @keyframes pulse-dot {

                0%,
                100% {
                    opacity: 1;
                    box-shadow: 0 0 0 0 rgba(43, 166, 72, 0.7);
                }

                50% {
                    opacity: 0.6;
                    box-shadow: 0 0 0 6px rgba(43, 166, 72, 0);
                }
            }

            /* Card Back */
            .card-back {
                transform: rotateY(180deg);
                background: linear-gradient(145deg, rgba(15, 28, 18, 0.95), rgba(5, 10, 5, 0.98));
                border-color: rgba(43, 166, 72, 0.2);
                justify-content: center;
                gap: 0.5rem;
            }

            .card-back-name {
                font-family: 'Syncopate', sans-serif;
                font-size: 0.85rem;
                font-weight: 700;
                margin-bottom: 0.5rem;
                color: #2BA648;
                text-shadow: 0 0 10px rgba(43, 166, 72, 0.3);
            }

            /* Social Links */
            .social-links {
                display: flex;
                flex-direction: column;
                gap: 0.8rem;
                width: 100%;
                max-width: 220px;
            }

            .social-links a {
                font-family: 'Host Grotesk', sans-serif;
                color: rgba(255, 255, 255, 0.8);
                text-decoration: none;
                padding: 0.75rem 1rem;
                border: 1px solid rgba(255, 255, 255, 0.08);
                border-radius: 12px;
                transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
                font-size: 0.8rem;
                text-transform: uppercase;
                letter-spacing: 1.5px;
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 0.7rem;
                background: rgba(255, 255, 255, 0.02);
                position: relative;
                overflow: hidden;
            }

            .social-links a::before {
                content: '';
                position: absolute;
                inset: 0;
                background: linear-gradient(135deg, rgba(43, 166, 72, 0.15), transparent);
                opacity: 0;
                transition: opacity 0.35s ease;
            }

            .social-links a:hover::before {
                opacity: 1;
            }

            .social-links a svg {
                transition: all 0.35s ease;
                flex-shrink: 0;
            }

            .social-links a:hover {
                border-color: rgba(43, 166, 72, 0.5);
                color: #2BA648;
                transform: translateX(5px);
                box-shadow: 0 4px 15px rgba(43, 166, 72, 0.15);
            }

            .social-links a:hover svg {
                transform: scale(1.2);
                filter: drop-shadow(0 0 5px rgba(43, 166, 72, 0.5));
            }

            /* ============================================
           PROJECT CSS (kept for Barba transitions)
           ============================================ */
            .reel-container {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                z-index: 10;
            }

            .project-item {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                will-change: transform;
            }

            .project-content {
                width: 100%;
                max-width: 1600px;
                padding: 0 4rem;
                display: grid;
                grid-template-columns: 1fr 2fr 1fr;
                gap: 2rem;
                align-items: center;
            }

            .project-counter {
                font-family: 'Syncopate', sans-serif;
                font-size: clamp(4rem, 10vw, 12rem);
                line-height: 0.8;
                letter-spacing: -0.05em;
                color: transparent;
                -webkit-text-stroke: 1px rgba(255, 255, 255, 0.2);
                transition: all 0.5s ease;
            }

            .project-counter span {
                font-size: 2rem;
                -webkit-text-stroke: 0;
                color: rgba(255, 255, 255, 0.3);
            }

            .is-active .project-counter {
                color: #2BA648;
                -webkit-text-stroke: 0;
            }

            .project-image-wrap {
                display: block;
                position: relative;
                width: 100%;
                height: 60vh;
                overflow: hidden;
                border-radius: 4px;
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
                cursor: pointer;
                transition: transform 0.5s ease, box-shadow 0.5s ease;
            }

            .project-image-wrap:hover {
                transform: scale(1.02);
                box-shadow: 0 30px 60px rgba(43, 166, 72, 0.15);
            }

            .project-image-wrap::after {
                content: '';
                position: absolute;
                inset: 0;
                background: linear-gradient(to bottom, transparent, rgba(15, 57, 24, 0.2));
                pointer-events: none;
                mix-blend-mode: multiply;
            }

            .project-image {
                position: absolute;
                top: -20%;
                left: 0;
                width: 100%;
                height: 140%;
                object-fit: cover;
                will-change: transform;
                filter: grayscale(80%) contrast(1.2);
                transition: filter 0.8s ease;
            }

            .is-active .project-image {
                filter: grayscale(0%) contrast(1);
            }

            .project-info {
                text-align: right;
            }

            .project-title {
                font-family: 'Syncopate', sans-serif;
                font-size: clamp(1.5rem, 3vw, 2.5rem);
                font-weight: 700;
                margin-bottom: 1rem;
                line-height: 1.1;
            }

            .project-title a {
                text-decoration: none;
                color: inherit;
                transition: color 0.3s ease;
            }

            .project-title a:hover {
                color: #2BA648;
            }

            .project-desc {
                font-family: 'Host Grotesk', sans-serif;
                font-size: 0.9rem;
                color: #94a3b8;
                max-width: 300px;
                margin-left: auto;
            }

            @media (max-width: 1024px) {
                .project-content {
                    display: flex;
                    flex-direction: column;
                    padding: 0 1.5rem;
                    justify-content: center;
                    height: 100%;
                }

                .project-counter {
                    position: relative;
                    top: auto;
                    left: auto;
                    font-size: clamp(3.5rem, 12vw, 5rem);
                    text-align: left;
                    width: 100%;
                    max-width: 500px;
                    margin: 0 auto 0.5rem auto;
                    order: 1;
                    z-index: 2;
                    opacity: 1;
                    line-height: 1;
                }

                .project-counter span {
                    font-size: 1.5rem;
                }

                .project-image-wrap {
                    height: 40vh;
                    width: 100%;
                    max-width: 500px;
                    margin: 0 auto;
                    order: 2;

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const hamburger = document.getElementById('hamburger');
            const mobileMenu = document.getElementById('mobile-menu');
            const mobileMenuClose = document.getElementById('mobile-menu-close');
            const menuLinks = document.querySelectorAll('.mobile-menu a');

            let menuIsOpen = false;

            function openMenu() {
                menuIsOpen = true;
                hamburger.classList.add('active');
                mobileMenu.classList.add('active');
                history.pushState({ menuOpen: true }, '');
                
                if (window.gsap) {
                    gsap.fromTo(menuLinks, 
                        { opacity: 0, y: 30, scale: 0.95 }, 
                        { opacity: 1, y: 0, scale: 1, duration: 0.5, stagger: 0.1, ease: "back.out(1.7)", delay: 0.3 }
                    );
                } else {
                    menuLinks.forEach(l => { l.style.opacity = 1; l.style.transform = 'none'; });
                }
            }

            function closeMenu() {
                menuIsOpen = false;
                hamburger.classList.remove('active');
                mobileMenu.classList.remove('active');
            }

            if(hamburger && mobileMenu) {
                hamburger.addEventListener('click', () => {
                    if (menuIsOpen) {
                        history.back();
                    } else {
                        openMenu();
                    }
                });
            }

            if(mobileMenuClose) {
                mobileMenuClose.addEventListener('click', () => {
                    if (menuIsOpen) history.back();
                });
            }

            window.addEventListener('popstate', (e) => {
                if (menuIsOpen) closeMenu();
            });
        });
    </script>
