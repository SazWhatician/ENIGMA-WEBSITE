    <main data-barba="container" data-barba-namespace="projects">
        <style>
            /* --- UNIFIED CSS --- */
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            body {
                background-color: #000;
                color: #fff;
                min-height: 100vh;
                overflow-x: hidden;
                font-family: 'Host Grotesk', sans-serif;
            }

            .blueprint-bg {
                position: fixed;
                inset: 0;
                z-index: 0;
                pointer-events: none;
                display: flex;
                justify-content: center;
                align-items: center;
            }

            .bp-circle {
                position: absolute;
                width: 90vmin;
                height: 90vmin;
                border: 1px solid rgba(255, 255, 255, 0.05);
                border-radius: 50%;
            }

            .bp-line-h {
                position: absolute;
                width: 100vw;
                height: 1px;
                background: rgba(255, 255, 255, 0.05);
            }

            .bp-line-v {
                position: absolute;
                width: 1px;
                height: 100vh;
                background: rgba(255, 255, 255, 0.05);
            }

            .bp-line-d1 {
                position: absolute;
                width: 150vw;
                height: 1px;
                background: rgba(255, 255, 255, 0.03);
                transform: rotate(30deg);
            }

            .bp-line-d2 {
                position: absolute;
                width: 150vw;
                height: 1px;
                background: rgba(255, 255, 255, 0.03);
                transform: rotate(-30deg);
            }

            nav {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                padding: 2rem;
                display: flex;
                justify-content: space-between;
                align-items: center;
                z-index: 2000;
                mix-blend-mode: difference;
            }

            nav,
            .logo p {
                font-weight: 700;
                font-size: 0.9rem;
                font-family: "Host Grotesk", sans-serif;
            }

            .logo a {
                text-decoration: none;
                color: white;
            }

            .nav-items {
                display: flex;
                gap: 2rem;
            }

            .nav-items a {
                text-decoration: none;
                color: white;
                transition: color 0.3s;
            }

            .nav-items a:hover {
                color: #2BA648;
            }

            @media(max-width: 768px) {
                nav {
                    padding: 1.2rem;
                    flex-direction: column;
                    gap: 0.8rem;
                }

                .nav-items {
                    gap: 0.8rem;
                    font-size: 0.75rem;
                    flex-wrap: wrap;
                    justify-content: center;
                }
            }

            .reel-container {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                z-index: 10;
            }

            .project-item {
                position: absolute;
                top: 0;
                left: 0;
                width: 100%;
                height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                will-change: transform;
            }

            .project-content {
                width: 100%;
                max-width: 1600px;
                padding: 0 4rem;
                display: grid;
                grid-template-columns: 1fr 2fr 1fr;
                gap: 2rem;
                align-items: center;
            }

            .project-counter {
                font-family: 'Syncopate', sans-serif;
                font-size: clamp(4rem, 10vw, 12rem);
                line-height: 0.8;
                letter-spacing: -0.05em;
                color: transparent;
                -webkit-text-stroke: 1px rgba(255, 255, 255, 0.2);
                transition: all 0.5s ease;
            }

            .project-counter span {
                font-size: 2rem;
                -webkit-text-stroke: 0;
                color: rgba(255, 255, 255, 0.3);
            }

            .is-active .project-counter {
                color: #2BA648;
                -webkit-text-stroke: 0;
            }

            .project-image-wrap {
                display: block;
                position: relative;
                width: 100%;
                height: 60vh;
                overflow: hidden;
                border-radius: 4px;
                box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
                cursor: pointer;
                transition: transform 0.5s ease;
            }

            .project-image {
                position: absolute;
                top: -20%;
                left: 0;
                width: 100%;
                height: 140%;
                object-fit: cover;
                filter: grayscale(80%);
            }

            .is-active .project-image {
                filter: grayscale(0%);
            }

            .project-info {
                text-align: right;
            }

            .project-title {
                font-family: 'Syncopate', sans-serif;
                font-size: clamp(1.5rem, 3vw, 2.5rem);
            }

            .project-title a {
                text-decoration: none;
                color: inherit;
                transition: color 0.3s ease;
            }

            .project-title a:hover {
                color: #2BA648;
            }

            .project-desc {
                font-family: 'Host Grotesk', sans-serif;
                font-size: 0.9rem;
                color: #94a3b8;
                max-width: 300px;
                margin-left: auto;
            }

            @media (max-width: 1024px) {
                .project-content {
                    display: flex;
                    flex-direction: column;
                    padding: 0 1.5rem;
                    justify-content: center;
                    height: 100%;
                }

                .project-counter {
                    position: relative;
                    font-size: clamp(3.5rem, 12vw, 5rem);
                    text-align: left;
                    width: 100%;
                    max-width: 500px;
                    margin: 0 auto 0.5rem auto;
                    order: 1;
                    z-index: 2;
                    line-height: 1;
                }

                .project-counter span {
                    font-size: 1.5rem;
                }

                .project-image-wrap {
                    height: 40vh;
                    width: 100%;
                    max-width: 500px;
                    margin: 0 auto;
                    order: 2;
                    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
                }

                .project-info {
                    text-align: left;
                    width: 100%;
                    max-width: 500px;
                    margin: 1.5rem auto 0 auto;
                    order: 3;
                }

                .project-desc {
                    margin: 0;
                    max-width: 100%;
                }

                .project-title {
                    font-size: clamp(1.5rem, 6vw, 2rem);
                    margin-bottom: 0.5rem;
                }
            }

            .team-container {
                position: relative;
                z-index: 10;
                width: 100%;
                max-width: 1400px;
                margin: 0 auto;
                padding: 8rem 2rem 4rem 2rem;
                display: flex;
                flex-direction: column;
                gap: 3rem;
            }

            .team-grid {
                display: grid;
                grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
                gap: 2rem;
                perspective: 1000px;
            }

            .team-card-wrapper {
                background-color: transparent;
                width: 100%;
                height: 350px;
                perspective: 1000px;
                cursor: pointer;
            }

            .card-inner {
                position: relative;
                width: 100%;
                height: 100%;
                text-align: center;
                transition: transform 0.8s;
                transform-style: preserve-3d;
            }

            .team-card-wrapper.flipped .card-inner {
                transform: rotateY(180deg);
            }

            .card-front,
            .card-back {
                position: absolute;
                width: 100%;
                height: 100%;
                backface-visibility: hidden;
                border-radius: 8px;
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                padding: 2rem;
                border: 1px solid rgba(255, 255, 255, 0.1);
                background: #0a0a0a;
            }

            .card-avatar {
                width: 90px;
                height: 90px;
                border-radius: 50%;
                margin-bottom: 1.2rem;
                object-fit: cover;
                background-color: rgba(255, 255, 255, 0.03);
                border: 1px solid rgba(255, 255, 255, 0.1);
            }

            .card-back {
                transform: rotateY(180deg);
                background: #0f1c12;
            }

            .social-links {
                display: flex;
                flex-direction: column;
                gap: 1rem;
                width: 100%;
            }

            .social-links a {
                font-family: 'Host Grotesk', sans-serif;
                color: white;
                text-decoration: none;
                padding: 0.8rem;
                border: 1px solid rgba(255, 255, 255, 0.1);
                border-radius: 4px;
                transition: all 0.3s ease;
                font-size: 0.9rem;
                text-transform: uppercase;
            }

            .project-counter,
            .project-image-wrap,
            .project-title,
            .project-desc,
            .team-card-wrapper {
                opacity: 0;
                visibility: hidden;
            }

            .page-transition {
                position: fixed;
                top: 0;
                left: 0;
                width: 100vw;
                height: 100vh;
                z-index: 9999;
                pointer-events: none;
                display: flex;
            }

            .transition-panel {
                flex: 1;
                height: 100%;
                background-color: #2BA648;
                transform: translateY(100%);
                will-change: transform;
                box-shadow: 2px 0 0 #2BA648;
            }
        
        .nav-items p:hover a {
            color: #2BA648 !important;
            text-shadow: 0 0 10px rgba(43, 166, 72, 0.8), 0 0 20px rgba(43, 166, 72, 0.4);
        }
        
        .hamburger {
            position: relative;
            width: 40px;
            height: 40px;
            display: none;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 2000;
        }
        .hamburger-lines {
            width: 24px;
            height: 12px;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .hamburger-lines span {
            display: block;
            width: 100%;
            height: 2px;
            background-color: #fff;
            border-radius: 2px;
            transition: transform 0.5s cubic-bezier(0.77, 0.2, 0.05, 1), opacity 0.5s ease;
            transform-origin: center;
        }
        .hamburger.active .hamburger-lines span:nth-child(1) {
            transform: translateY(5px) rotate(45deg);
        }
        .hamburger.active .hamburger-lines span:nth-child(2) {
            transform: scaleX(0);
            opacity: 0;
        }
        .hamburger.active .hamburger-lines span:nth-child(3) {
            transform: translateY(-5px) rotate(-45deg);
        }
        
        .mobile-menu {
            position: fixed;
            top: 0;
            right: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(10, 10, 10, 0.95);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 3rem;
            z-index: 1500;
            clip-path: circle(0% at 100% 0%);
            transition: clip-path 0.8s cubic-bezier(0.77, 0, 0.175, 1);
        }
        .mobile-menu.active {
            clip-path: circle(150% at 100% 0%);
        }
        .mobile-menu-close {
            position: absolute;
            top: 1.5rem;
            right: 1.5rem;
            width: 40px;
            height: 40px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: #fff;
            opacity: 0;
            transform: rotate(-90deg);
            transition: opacity 0.5s ease 0.4s, transform 0.8s cubic-bezier(0.77, 0, 0.175, 1) 0.2s;
        }
        .mobile-menu.active .mobile-menu-close {
            opacity: 1;
            transform: rotate(0deg);
        }
        .mobile-menu-close svg {
            width: 28px;
            height: 28px;
        }
        .mobile-menu a {
            font-size: 2.5rem;
            font-family: 'Syncopate', sans-serif;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.6);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            opacity: 0;
            transform: translateY(30px) scale(0.95);
            transition: color 0.4s ease, text-shadow 0.4s ease;
        }
        .mobile-menu a:hover {
            color: #2BA648;
            text-shadow: 0 0 20px rgba(43, 166, 72, 0.6), 0 0 40px rgba(43, 166, 72, 0.3);
            transform: scale(1.05);
        }

        @media(max-width: 768px) {
            nav {
                background: transparent !important;
                backdrop-filter: none !important;
                -webkit-backdrop-filter: none !important;
                border-bottom: none !important;
                flex-direction: row !important;
                justify-content: space-between !important;
                align-items: center !important;
                padding: 1.5rem !important;
            }
            .nav-items { display: none !important; }
            
        }
    </style>

        <div class="logo">

            <p><a href="project.html" style="text-decoration: none; color: #fff; transition: all 0.3s ease; position: relative; font-weight: 450; font-size: 0.9rem;">Projects</a></p>

        <div class="hamburger" id="hamburger">
            <div class="hamburger-lines">
                <span></span>

        </div>

    <div class="mobile-menu" id="mobile-menu">
        <div class="mobile-menu-close" id="mobile-menu-close">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6L6 18M6 6l12 12"></path></svg>
        </div>

    <script src="./js/common.js"></script>


        <script>
        // Use event delegation for Barba.js compatibility
        document.addEventListener('click', (e) => {
            const hamburgerBtn = e.target.closest('#hamburger');
            const closeBtn = e.target.closest('#mobile-menu-close');
            const menuLink = e.target.closest('.mobile-menu a');
            
            const mobileMenu = document.getElementById('mobile-menu');
            const realHamburger = document.getElementById('hamburger');

            if (!mobileMenu || !realHamburger) return;

            function openMenu() {
                realHamburger.classList.add('active');
                mobileMenu.classList.add('active');
                history.pushState({ menuOpen: true }, '');
                
                const menuLinks = document.querySelectorAll('.mobile-menu a');
                if (window.gsap) {
                    gsap.fromTo(menuLinks, 
                        { opacity: 0, y: 30, scale: 0.95 }, 
                        { opacity: 1, y: 0, scale: 1, duration: 0.5, stagger: 0.1, ease: "back.out(1.7)", delay: 0.3 }
                    );
                } else {
                    menuLinks.forEach(l => { l.style.opacity = 1; l.style.transform = 'none'; });
                }
            }

            function closeMenu() {
                realHamburger.classList.remove('active');
                mobileMenu.classList.remove('active');
            }

            if (hamburgerBtn) {
                if (mobileMenu.classList.contains('active')) {
                    history.back();
                } else {
                    openMenu();
                }
            } else if (closeBtn) {
                if (mobileMenu.classList.contains('active')) history.back();
            } else if (menuLink) {
                // Remove active class immediately without history.back() 
                // because clicking a link will trigger Barba navigation
                closeMenu();
            }
        });

        window.addEventListener('popstate', (e) => {
            const mobileMenu = document.getElementById('mobile-menu');
            const realHamburger = document.getElementById('hamburger');
            if (mobileMenu && mobileMenu.classList.contains('active')) {
                mobileMenu.classList.remove('active');
                if (realHamburger) realHamburger.classList.remove('active');
            }
        });
    </script>
